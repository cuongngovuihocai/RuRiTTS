    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        var suppress = function(e) {
          var msg = (e && (e.message || (e.reason && e.reason.message))) || '';
          var file = (e && e.filename) || '';
          if (
            (typeof msg === 'string' && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1)) ||
            (typeof file === 'string' && file.indexOf('@vite/client') !== -1)
          ) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        };
        window.addEventListener('error', suppress, true);
        window.addEventListener('unhandledrejection', suppress, true);
      })();
    </script>
